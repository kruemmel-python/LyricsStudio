name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Das Projekt verwendet ausdrücklich den CMake-Generator Visual Studio 17 2022.
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Python 3.12 einrichten
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: .NET einrichten
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: WiX Toolset installieren
        shell: pwsh
        # WiX 7 verlangt auf kurzlebigen CI-Runnern eine separate OSMF-EULA.
        # Version 6.0.2 verarbeitet und validiert dieselbe WiX-v4-Paketdefinition.
        run: dotnet tool install --global wix --version 6.0.2

      - name: Portable und MSI bauen
        shell: pwsh
        run: .\BUILD_RELEASE.ps1 -Version 2.1.1

      - name: Release-Pakete als Workflow-Artefakt sichern
        uses: actions/upload-artifact@v7
        with:
          name: KlanggeistLyricsStudio-2.1.1-windows
          path: |
            dist/KlanggeistLyricsStudio-2.1.1-portable.zip
            dist/KlanggeistLyricsStudio-2.1.1-x64.msi
            dist/SHA256SUMS.txt
          if-no-files-found: error
